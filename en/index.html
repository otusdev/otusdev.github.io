<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OTUS</title>
  <meta name="description" content="OTUS: games and apps for Android.">
  <meta name="theme-color" content="#12151C">
  <link rel="alternate" hreflang="pt-BR" href="https://otusdev.github.io/">
  <link rel="alternate" hreflang="en" href="https://otusdev.github.io/en/">
  <style>
    :root {
      --bg: #12151C;
      --surface: #1B1F2A;
      --cell: #232937;
      --text: #F2F4F8;
      --muted: #8A93A6;
      --accent: #4FC3F7;
      --gold: #FFD54F;
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      line-height: 1.6;
    }
    a { color: var(--accent); }
    a:hover { text-decoration-thickness: 2px; }
    .top {
      display: flex;
      justify-content: flex-end;
      max-width: 760px;
      margin: 0 auto;
      padding: 20px 20px 0;
    }
    .top a { color: var(--muted); text-decoration: none; font-weight: 600; }
    .top a:hover { color: var(--text); }
    main {
      max-width: 760px;
      margin: 0 auto;
      padding: 24px 20px 40px;
    }

    .hero { text-align: center; margin-bottom: 48px; }
    .logo {
      display: inline-grid;
      grid-template-columns: repeat(5, 18px);
      gap: 5px;
      margin-bottom: 18px;
    }
    .logo span { width: 18px; height: 18px; border-radius: 4px; }
    .hero h1 {
      margin: 0;
      font-size: 44px;
      line-height: 1.1;
      letter-spacing: 0.5px;
    }
    .hero p { margin: 10px 0 0; color: var(--muted); font-size: 18px; }

    .app {
      display: flex;
      gap: 20px;
      align-items: flex-start;
      background: var(--surface);
      border-radius: 20px;
      padding: 24px;
    }
    .board {
      flex: none;
      display: grid;
      grid-template-columns: repeat(4, 16px);
      gap: 4px;
      padding: 10px;
      background: var(--bg);
      border-radius: 16px;
    }
    .board span { width: 16px; height: 16px; border-radius: 4px; background: var(--cell); }
    .app h2 { margin: 0 0 6px; font-size: 22px; }
    .app p { margin: 0 0 12px; }
    .status {
      display: inline-block;
      padding: 2px 10px;
      border-radius: 999px;
      border: 1px solid var(--gold);
      color: var(--gold);
      font-size: 14px;
      font-weight: 600;
    }
    .links { margin-bottom: 0; }

    footer {
      margin-top: 48px;
      text-align: center;
      color: var(--muted);
      font-size: 15px;
    }
    footer p { margin: 4px 0; }

    @media (max-width: 480px) {
      main { padding-top: 16px; }
      .app { flex-direction: column; padding: 20px; }
    }
  </style>
</head>
<body>
  <nav class="top"><a href="../" hreflang="pt-BR" lang="pt-BR">Português</a></nav>

  <main>
    <header class="hero">
      <!-- A "V" built from the game's blocks. -->
      <div class="logo" aria-hidden="true">
        <span style="background:#4FC3F7"></span><span></span><span></span><span></span><span style="background:#BA68C8"></span>
        <span></span><span style="background:#81C784"></span><span></span><span style="background:#FFB74D"></span><span></span>
        <span></span><span></span><span style="background:#FFF176"></span><span></span><span></span>
      </div>
      <h1>OTUS</h1>
      <p>Games and apps for Android.</p>
    </header>

    <section aria-label="Apps">
      <article class="app">
        <div class="board" aria-hidden="true">
          <span style="background:#4FC3F7"></span><span style="background:#4FC3F7"></span><span></span><span style="background:#E57373"></span>
          <span></span><span style="background:#4FC3F7"></span><span></span><span style="background:#E57373"></span>
          <span style="background:#81C784"></span><span style="background:#81C784"></span><span style="background:#81C784"></span><span style="background:#E57373"></span>
          <span></span><span style="background:#FFD54F"></span><span style="background:#FFD54F"></span><span></span>
        </div>
        <div>
          <h2>Octaluz</h2>
          <p>Drag the pieces onto the 8×8 board and fill rows and columns to clear them. Quick games, no sign-up, and a new challenge every day.</p>
          <p><span class="status">Coming soon to Google Play</span></p>
          <p class="links"><a href="../octaluz/en/">See the game</a> · <a href="../octaluz/privacy.html">Privacy policy</a></p>
        </div>
      </article>
    </section>

    <footer>
      <p>Contact: <a href="mailto:otus.dev@gmail.com">otus.dev@gmail.com</a></p>
      <p>© 2026 OTUS</p>
    </footer>
  </main>
</body>
</html>
